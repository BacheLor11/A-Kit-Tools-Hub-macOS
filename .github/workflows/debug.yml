name: Debug Build

# 临时诊断用：把 runner 上的编译输出推到 ci-log 分支，方便从 raw 地址读。
# 定位完问题就删掉这个文件。
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build (capture)
        run: |
          set +e
          {
            echo "=== swift --version ==="
            swift --version
            echo "=== uname ==="
            uname -a
            echo "=== swift build ==="
            swift build --disable-sandbox
            echo "=== exit=$? ==="
          } > /tmp/build.log 2>&1
          tail -60 /tmp/build.log

      - name: Publish log to ci-log branch
        if: always()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          cp /tmp/build.log ./ci-build.log
          git add -f ci-build.log
          git commit -m "ci: build log" || true
          git push origin HEAD:ci-log --force
