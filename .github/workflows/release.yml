name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不带 v，如 0.2.0）"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 准备打包依赖
        run: pip3 install --quiet pillow || echo '没装上也行，图标已在 Resources/ 里'

      - name: 确认版本
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      # 更新说明优先取 CHANGELOG.md 里对应版本的那一段（人写的，分「新增 / 变更 / 修复」）；
      # 没有这一段才退回 git log 攒 —— 那种只能列 commit 标题，读起来像流水账。
      - name: 生成更新说明
        run: |
          mkdir -p build
          PREV=$(git describe --tags --abbrev=0 "v${VERSION}^" 2>/dev/null || true)
          export PREV
          python3 - "$VERSION" > build/RELEASE_NOTES.md <<'PY'
          import re, subprocess, sys, pathlib, os

          version = sys.argv[1]
          out = [f"## A-Kit {version}", ""]

          section = ""
          p = pathlib.Path("CHANGELOG.md")
          if p.exists():
              text = p.read_text(encoding="utf-8")
              # 匹配 "## 0.5.8" 或 "## [0.5.8]" 开头的段落，直到下一个二级标题
              m = re.search(rf"^##\s*\[?{re.escape(version)}\]?[^\n]*\n(.*?)(?=^##\s|\Z)",
                            text, re.S | re.M)
              if m:
                  # 去掉段落末尾那条分隔线，不然 Release 正文会以一根横线结尾
                  section = re.sub(r"\n-{3,}\s*$", "", m.group(1).strip()).strip()

          if section:
              out.append(section)
          else:
              prev = os.environ.get("PREV", "")
              rng = f"{prev}..HEAD" if prev else "HEAD"
              log = subprocess.run(["git", "log", "--no-merges", "--reverse",
                                    "--pretty=format:- %s", rng],
                                   capture_output=True, text=True).stdout
              out.append("_CHANGELOG.md 里还没有这一版，以下为提交记录：_")
              out.append("")
              out.append(log)

          prev = os.environ.get("PREV", "")
          if prev:
              repo = os.environ.get("GITHUB_REPOSITORY", "")
              out += ["", f"**完整对比**：https://github.com/{repo}/compare/{prev}...v{version}"]

          # 给 manifest.json 用的那一句话摘要：取这一段里第一条加粗标题，
          # 取不到就用提交标题。以前直接用 `git log -1 --pretty=%s`，
          # 光发一次文档提交也会把它带进去，读起来驴唇不对马嘴。
          summary = ""
          if section:
              m2 = re.search(r"^- \*\*(.+?)\*\*", section, re.M)
              if m2:
                  summary = m2.group(1).strip()
          if not summary:
              summary = subprocess.run(["git", "log", "-1", "--pretty=%s"],
                                       capture_output=True, text=True).stdout.strip()
          pathlib.Path("build/SUMMARY.txt").write_text(summary + "\n", encoding="utf-8")

          print("\n".join(out))
          PY
          cat build/RELEASE_NOTES.md
          echo "摘要：$(cat build/SUMMARY.txt)"

      - name: 打包
        run: |
          VERSION="${{ env.VERSION }}"
          PYTHON=python3 bash Scripts/build.sh
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            "build/A-Kit.app" "build/A-Kit-${VERSION}.zip"
          SHA=$(shasum -a 256 "build/A-Kit-${VERSION}.zip" | awk '{print $1}')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          echo "ZIP=build/A-Kit-${VERSION}.zip" >> "$GITHUB_ENV"

      - name: 生成 manifest.json
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/A-Kit-${VERSION}.zip"
          python3 Scripts/gen_manifest.py \
            --version "$VERSION" \
            --url "$URL" \
            --sha256 "$SHA" \
            --notes "$(cat build/SUMMARY.txt)" \
            --out build/manifest.json
          cat build/manifest.json

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: A-Kit ${{ env.VERSION }}
          body_path: build/RELEASE_NOTES.md
          generate_release_notes: false
          files: |
            build/A-Kit-${{ env.VERSION }}.zip
            build/manifest.json
