name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift
        run: swift --version

      - name: Build
        run: swift build --disable-sandbox

      - name: 打包脚本冒烟（干净 runner 里没有 build/）
        run: |
          bash Scripts/build.sh
          test -x "build/A-Kit.app/Contents/MacOS/AKitHub"
          test -f "build/A-Kit.app/Contents/Resources/seed-manifest.json"

      - name: Protocol selftest
        run: ./.build/debug/AKitHub --selftest

      - name: CLI smoke test
        run: |
          ./.build/debug/akit help
          ./.build/debug/akit inspect not-a-url && exit 1 || true

      - name: SDK 单文件与源码保持同步
        run: diff -q Sources/AKitStatusKit/AKitStatusKit.swift SDK/AKitStatusKit.swift
